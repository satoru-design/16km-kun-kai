<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>半径16kmマップ (検索強化版)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS (APIキー不要) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <style>
        #map {
            height: 100vh;
            width: 100%;
            z-index: 0;
        }
        .control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            max-height: 90vh;
            overflow-y: auto;
        }
        .input-group {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-100 overflow-hidden">

    <div id="map"></div>

    <div class="control-panel w-96 bg-gray-50/90 backdrop-blur-sm p-6 rounded-xl shadow-2xl border border-gray-200">
        <h2 class="text-xl font-bold text-gray-700 mb-4 border-b pb-2">
            <i class="fa-solid fa-map-location-dot mr-2"></i>地点設定
        </h2>
        
        <div id="address-container" class="space-y-3 mb-6"></div>

        <button id="draw-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition duration-200 flex items-center justify-center gap-2">
            <i class="fa-solid fa-circle-nodes"></i>
            円を表示させる
        </button>

        <p id="status-msg" class="text-sm text-center mt-3 text-gray-500 font-medium"></p>
        <p class="text-xs text-center mt-2 text-gray-400">Powered by OpenStreetMap</p>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // --- 設定 ---
        const RADIUS_KM = 16;
        const RADIUS_METERS = RADIUS_KM * 1000;
        
        const defaultAddresses = [
            "横浜市神奈川区鶴屋町２丁目21−１",
            "千代田区神田3-17-10"
        ];

        let map;
        let mapObjects = [];

        const container = document.getElementById('address-container');
        const drawBtn = document.getElementById('draw-btn');
        const statusMsg = document.getElementById('status-msg');

        // --- 地図初期化 ---
        function initMap() {
            map = L.map('map').setView([35.681236, 139.767125], 10);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
        }
        initMap();

        // --- 住所正規化と補正 ---
        function normalizeAddress(address) {
            if (!address) return "";
            let normalized = address.trim();
            
            // 全角→半角
            normalized = normalized.replace(/[Ａ-Ｚａ-ｚ０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0));
            normalized = normalized.replace(/[－−]/g, '-');
            normalized = normalized.replace(/\s+/g, ' ');

            // 都道府県の補完（簡易的）
            if (normalized.startsWith("千代田区") || normalized.startsWith("港区") || normalized.startsWith("新宿区") || normalized.startsWith("渋谷区")) {
                normalized = "東京都" + normalized;
            } else if (normalized.startsWith("横浜市") || normalized.startsWith("川崎市")) {
                if (!normalized.startsWith("神奈川県")) {
                    normalized = "神奈川県" + normalized;
                }
            }

            return normalized;
        }

        // --- 段階的検索ロジック (ここが強化ポイント) ---
        async function smartGeocode(originalAddress) {
            let searchAddress = normalizeAddress(originalAddress);
            
            // 1. まずそのまま検索
            let result = await fetchNominatim(searchAddress);
            if (result) return { ...result, isApprox: false };

            // 2. 最後のハイフン以降（番地）を削除して検索 (例: 3-17-10 -> 3-17)
            let broaderAddress = searchAddress.replace(/-[0-9]+$/, '');
            if (broaderAddress !== searchAddress) {
                result = await fetchNominatim(broaderAddress);
                if (result) return { ...result, isApprox: true, note: "番地が見つからないため付近を表示" };
            }

            // 3. さらにハイフンがあれば削除 (例: 3-17 -> 3)
            let evenBroader = broaderAddress.replace(/-[0-9]+$/, '');
            if (evenBroader !== broaderAddress) {
                result = await fetchNominatim(evenBroader);
                if (result) return { ...result, isApprox: true, note: "詳細が見つからないため町域を表示" };
            }

            // 4. 数字自体を削除して町名のみ検索 (例: 神田3 -> 神田)
            let townOnly = searchAddress.replace(/[0-9\-]+$/, '');
            if (townOnly !== searchAddress && townOnly.length > 3) { // 短すぎると誤爆するので制限
                result = await fetchNominatim(townOnly);
                if (result) return { ...result, isApprox: true, note: "町名のみで検索しました" };
            }

            return null;
        }

        async function fetchNominatim(query) {
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=jp&limit=1`;
            try {
                await new Promise(resolve => setTimeout(resolve, 800)); // API負荷対策
                const res = await fetch(url);
                const data = await res.json();
                return (data && data.length > 0) ? { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), display: data[0].display_name } : null;
            } catch (e) {
                console.error(e);
                return null;
            }
        }

        // --- HTMLエスケープ ---
        // ポップアップは innerHTML として解釈されるため、
        // 利用者の入力と Nominatim の応答は必ずここを通す。
        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, c => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[c]);
        }

        // --- UI関連 ---
        function addInputGroup(value = "", isLast = false, index, totalCount) {
            const div = document.createElement('div');
            div.className = "input-group flex items-center gap-2";
            
            const numberSpan = document.createElement('span');
            numberSpan.className = "text-green-600 font-bold text-lg w-6 flex-shrink-0 text-center";
            numberSpan.textContent = index + 1;

            const input = document.createElement('input');
            input.type = "text";
            input.className = "flex-1 bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 shadow-sm";
            input.placeholder = "住所を入力";
            input.value = value;

            div.appendChild(numberSpan);
            div.appendChild(input);

            const actionContainer = document.createElement('div');
            actionContainer.className = "flex items-center justify-end gap-1 min-w-[70px]";

            if (totalCount > 1) {
                const deleteBtn = document.createElement('button');
                deleteBtn.className = "text-gray-400 hover:text-red-500 p-2 rounded-full transition flex items-center justify-center w-8 h-8";
                deleteBtn.innerHTML = '<i class="fa-solid fa-trash"></i>';
                deleteBtn.onclick = () => removeField(index);
                actionContainer.appendChild(deleteBtn);
            } else {
                actionContainer.appendChild(document.createElement('div')).className = "w-8 h-8";
            }

            if (isLast) {
                const plusBtn = document.createElement('button');
                plusBtn.className = "text-blue-500 hover:text-blue-700 bg-blue-100 hover:bg-blue-200 rounded-full w-8 h-8 flex items-center justify-center transition flex-shrink-0";
                plusBtn.innerHTML = '<i class="fa-solid fa-plus"></i>';
                plusBtn.onclick = addNewField;
                actionContainer.appendChild(plusBtn);
            } else {
                actionContainer.appendChild(document.createElement('div')).className = "w-8 h-8";
            }

            div.appendChild(actionContainer);
            container.appendChild(div);
        }

        function renderInputs(addresses) {
            container.innerHTML = '';
            addresses.forEach((val, idx) => addInputGroup(val, idx === addresses.length - 1, idx, addresses.length));
        }

        function addNewField() {
            const current = Array.from(container.querySelectorAll('input')).map(i => i.value);
            current.push("");
            renderInputs(current);
        }

        function removeField(index) {
            const current = Array.from(container.querySelectorAll('input')).map(i => i.value);
            if (current.length > 1) {
                current.splice(index, 1);
                renderInputs(current);
            }
        }

        // --- 実行ボタン ---
        drawBtn.addEventListener('click', async () => {
            const inputs = container.querySelectorAll('input');
            const addresses = Array.from(inputs).map(i => i.value).filter(v => v.trim() !== "");

            if (addresses.length === 0) {
                statusMsg.textContent = "住所を入力してください。";
                statusMsg.className = "text-center mt-3 text-red-500 font-bold";
                return;
            }

            drawBtn.disabled = true;
            drawBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 検索中...';
            statusMsg.textContent = "地図情報を取得しています...";
            statusMsg.className = "text-center mt-3 text-gray-500";

            mapObjects.forEach(obj => map.removeLayer(obj));
            mapObjects = [];
            const bounds = L.latLngBounds();
            let successCount = 0;

            for (const addr of addresses) {
                const result = await smartGeocode(addr);

                if (result) {
                    const latLng = [result.lat, result.lon];
                    
                    // ポップアップの内容作成
                    let popupContent = `<b>${escapeHtml(addr)}</b><br>半径${RADIUS_KM}km`;
                    if (result.isApprox) {
                        popupContent += `<br><span class="text-xs text-orange-600">※${escapeHtml(result.note)}</span>`;
                    }
                    popupContent += `<br><span class="text-xs text-gray-400">${escapeHtml(result.display)}</span>`;

                    const marker = L.marker(latLng).addTo(map).bindPopup(popupContent);
                    if (result.isApprox) marker.openPopup(); // 補正時は気づくようにポップアップを開く
                    mapObjects.push(marker);

                    const circle = L.circle(latLng, {
                        color: 'blue',
                        fillColor: '#30f',
                        fillOpacity: 0.1,
                        radius: RADIUS_METERS
                    }).addTo(map);
                    mapObjects.push(circle);

                    bounds.extend(circle.getBounds());
                    successCount++;
                }
            }

            drawBtn.disabled = false;
            drawBtn.innerHTML = '<i class="fa-solid fa-circle-nodes"></i> 円を表示させる';

            if (successCount > 0) {
                map.fitBounds(bounds);
                if (successCount < addresses.length) {
                    statusMsg.textContent = `${successCount}箇所表示（一部見つかりませんでした）`;
                    statusMsg.className = "text-center mt-3 text-orange-600 font-bold";
                } else {
                    statusMsg.textContent = `${successCount}箇所の円を表示しました`;
                    statusMsg.className = "text-center mt-3 text-green-600 font-bold";
                }
            } else {
                statusMsg.textContent = "住所が見つかりませんでした。";
                statusMsg.className = "text-center mt-3 text-red-500 font-bold";
            }
        });

        renderInputs(defaultAddresses);

    </script>
</body>
</html>
